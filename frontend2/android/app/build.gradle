import java.util.Properties
import java.io.FileInputStream


plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // Flutter Gradle Plugin must be applied after Android and Kotlin
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def flutterCompileSdkVersion = 36
def flutterTargetSdkVersion = 36

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    println("⚠️ Warning: key.properties not found — release signing may fail.")
}

def openWeatherApiKey = (keystoreProperties['OPENWEATHER_API_KEY'] ?: '').toString()
def escapedOpenWeatherApiKey = openWeatherApiKey
        .replace('\\', '\\\\')
        .replace('"', '\\"')

android {
    namespace "in.codingclub.hab"
    compileSdk 36
    ndkVersion "27.0.12077973"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "in.codingclub.hab"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode.toInteger()
        versionName flutter.versionName
        manifestPlaceholders = [appAuthRedirectScheme: "placeholder-text"]
        buildConfigField "String", "OPENWEATHER_API_KEY", "\"${escapedOpenWeatherApiKey}\""
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
