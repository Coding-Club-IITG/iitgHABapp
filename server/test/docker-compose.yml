services:
  server:
    build:
      context: ..
      dockerfile: test/Dockerfile
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    volumes:
      - ../.secrets:/app/.secrets:ro
    environment:
      TZ: "Asia/Kolkata"
      PORT: "3000"
